# ###########################################################################
# Production deploy: a single `terraform apply` builds the linux/arm64
# image, pushes it to ECR (via terraform_data.image in terraform/build.tf),
# and updates the AgentCore Runtime to the new content-addressed tag.
#
# Triggered on every push to main that touches anything that goes into the
# image (app, deps, Dockerfile) or the Terraform configuration.
# Documentation-only changes do NOT redeploy.
#
# Authentication uses GitHub OIDC against an IAM role in the target
# AWS account; no static AWS credentials are stored in the repo.
# ###########################################################################
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"

# OIDC requires id-token: write. contents: read is needed for actions/checkout.
permissions:
  id-token: write
  contents: read

# Only one deploy at a time. If a second push lands while the first is
# in flight, queue it (don't cancel) so we never skip a deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: terraform apply (builds + pushes image)
    runs-on: ubuntu-latest
    env:
      # Region is hardcoded here (single-region project) so it does not
      # have to be threaded through repository variables. Keep aligned
      # with terraform/variables.tf:region default.
      AWS_REGION: us-west-2
    steps:
      # Pull the commit being deployed into the workspace.
      - name: Checkout
        uses: actions/checkout@v4

      # Exchange the GitHub OIDC token for short-lived AWS credentials.
      # AWS_ROLE_ARN is configured as a repository variable (or secret)
      # and points at a role whose trust policy allows this repo + branch.
      # The role needs the usual Terraform-apply permissions PLUS ECR
      # push (the build step inside terraform apply does docker login +
      # docker push).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register QEMU binfmt handlers so the linux/arm64 build inside
      # terraform_data.image can run on this amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # buildx is required for the cross-architecture build invoked by
      # terraform_data.image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Install Terraform to match the version pinned in versions.tf.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # `terraform init` requires a `backend.tf`. We expect the operator
      # to have committed one (or used a wrapper that materializes it
      # from secrets); the example file ships in terraform/backend.tf.example.
      - name: terraform init
        working-directory: terraform
        run: terraform init

      # Single command. terraform_data.image (terraform/build.tf) does
      # docker login + buildx build --provenance=false --push, then the
      # AgentCore Runtime updates its container_uri to the new
      # content-addressed tag. -auto-approve is safe here because every
      # change has already been reviewed via the PR that produced this
      # commit.
      - name: terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
