# ###########################################################################
# Continuous integration for pull requests targeting `main`.
#
# We run two parallel checks: Python lint (ruff) and Terraform formatting
# + validation. Neither requires AWS credentials, so this workflow can
# run on PRs from forks without secret exposure.
# ###########################################################################
name: CI

on:
  pull_request:
    branches: [main]

# Workflow-level permissions: read-only is sufficient for lint/validate.
permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      # Pull the PR head into the runner workspace.
      - name: Checkout
        uses: actions/checkout@v4

      # Install uv. The astral action handles caching and adds uv to PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Install Python 3.13 — uv can manage this itself, but pinning the
      # version explicitly here makes the runner deterministic.
      - name: Set up Python
        run: uv python install 3.13

      # Sync dev + runtime dependencies into a project-local .venv.
      - name: Install dependencies
        run: uv sync --dev

      # Lint application + seed code. Ruff config lives in pyproject.toml.
      - name: Run ruff
        run: uv run ruff check app/ seeds/

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      # Pull the PR head into the runner workspace.
      - name: Checkout
        uses: actions/checkout@v4

      # Install Terraform; version pinned to the same line we declare
      # in versions.tf so local dev and CI stay aligned.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Enforce canonical formatting across every .tf file in the repo.
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      # Initialize without a backend so we can validate without needing
      # the real S3 bucket and credentials.
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      # Validate provider/resource references. This catches typos in
      # the Terraform configuration without spinning up any AWS state.
      - name: terraform validate
        working-directory: terraform
        run: terraform validate
